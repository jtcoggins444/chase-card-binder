name: Check API keys

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Try the keys
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/probe.mjs
      - name: Save samples to the probe branch
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B probe
          git add probe
          git commit -m "API probe samples" || true
          git push -f origin probe
