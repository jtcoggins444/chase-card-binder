name: Check card shop sites

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma-separated domains'
        default: 'common-lands.com,onestoptcg.com'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-stores.mjs
        env:
          SITES: ${{ inputs.sites }}
      - name: Save to the probe branch
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B probe
          git add -f probe
          git commit -m "store probe" || true
          git push -f origin probe
