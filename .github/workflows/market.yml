name: Daily market data

on:
  schedule:
    # PokemonPriceTracker refreshes around 12:00 UTC; run after that (about 45 minutes).
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Most cards to fetch (blank = all)'
        default: ''

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PokemonPriceTracker history, graded sales and Cardmarket
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: node scripts/ppt.mjs ${{ github.event.inputs.max }}
      - name: Save to the repository
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ppt
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Market data for $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
