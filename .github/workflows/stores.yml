name: Card shop stock

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stores
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/stores.mjs
      - name: Save
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Card shop stock $(date -u +'%F')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
