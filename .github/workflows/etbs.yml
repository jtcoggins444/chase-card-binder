name: Add Elite Trainer Boxes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  etbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect Elite Trainer Boxes and rebuild the page
        run: |
          node scripts/etbs.mjs
          node scripts/update.mjs --build-only
      - name: Save to the repository
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Add Elite Trainer Boxes"
          git push
