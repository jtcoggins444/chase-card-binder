name: Send phone alert

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Alert title'
        default: 'Chase Card Binder'
      message:
        description: 'Alert text'
        required: true
      click:
        description: 'Link to open (optional)'
        default: 'https://jtcoggins444.github.io/chase-card-binder/'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TITLE: ${{ github.event.inputs.title }}
          MSG: ${{ github.event.inputs.message }}
          CLICK: ${{ github.event.inputs.click }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret"; exit 0; fi
          curl -sS -H "Title: $TITLE" -H "Click: $CLICK" -H "Tags: newspaper" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
