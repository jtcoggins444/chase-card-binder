name: Double Holo cashback watch

on:
  schedule:
    # every 3 hours; Double Holo reveals each event at midnight Eastern the day before
    - cron: '9 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Double Holo events
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/dh.mjs
      - name: Save to the repository
        run: |
          git config user.name "binder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dh.json data/dh-seen.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Double Holo cashback $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
